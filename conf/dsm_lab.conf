# Clúster de varias computadoras (laboratorio). Todas las máquinas deben usar EXACTAMENTE este
# mismo archivo: el config_hash se compara al unirse y un archivo distinto se rechaza.
#   1. Reemplazar las líneas NODE por las IP de las máquinas (una por línea, en el mismo orden en
#      todas). La primera es la fundadora: su nodo del slot 0 debe arrancar primero.
#   2. Abrir en el firewall los puertos PORT_BASE .. PORT_BASE + 4 * SLOTS_PER_HOST - 1 (TCP).
#   3. En cada máquina, un proceso por nodo: ./apps/hello_dsm conf/dsm_lab.conf <nodos totales>
# Con 256 MB por nodo, 4 nodos dan 1 GB de memoria DSM (alcanza para gemm 4096 y el video).
PAGE_SIZE=4096
NODE_MEM_MB=256
MAX_GLOBAL_MB=4096
MAX_NODES=64
GLOBAL_BASE_ADDR=0x600000000000
PORT_BASE=27100
PORT_RANGE=100
SLOTS_PER_HOST=8
NODE=192.168.0.101
NODE=192.168.0.102
CACHE_MAX_PAGES=65536
SERVICE_THREADS=4
HEARTBEAT_INTERVAL_MS=1000
SUSPECT_AFTER_MS=3000
HEARTBEAT_TIMEOUT_MS=10000
JOIN_TIMEOUT_MS=15000
REQUEST_TIMEOUT_MS=2000
MAX_RETRIES=5
LOG_LEVEL=info
