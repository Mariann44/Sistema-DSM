# Clúster local para los escenarios grandes de gemm (varios nodos en una sola máquina).
# Con 3 nodos hay 3 x 256 MB = 768 MB de memoria DSM. Ejemplos de lo que cabe (doubles):
#   -n 2048 2048 2048  ->  3 x 32 MB  =  96 MB
#   -n 4096 4096 4096  ->  3 x 128 MB = 384 MB  (cruza los slices de varios nodos)
#   -n 6144 6144 6144  ->  3 x 288 MB = 864 MB  (necesita 4 nodos)
# Para el laboratorio, cambiar NODE=127.0.0.1 por las IP de las máquinas (la primera funda el clúster).
PAGE_SIZE=4096
NODE_MEM_MB=256
MAX_GLOBAL_MB=4096
MAX_NODES=64
GLOBAL_BASE_ADDR=0x600000000000
PORT_BASE=27100
PORT_RANGE=100
SLOTS_PER_HOST=8
NODE=127.0.0.1
CACHE_MAX_PAGES=262144
SERVICE_THREADS=4
HEARTBEAT_INTERVAL_MS=1000
SUSPECT_AFTER_MS=3000
HEARTBEAT_TIMEOUT_MS=10000
JOIN_TIMEOUT_MS=15000
REQUEST_TIMEOUT_MS=2000
MAX_RETRIES=5
LOG_LEVEL=info
